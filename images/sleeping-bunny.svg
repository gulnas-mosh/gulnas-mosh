<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 289 161" width="289" height="161" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,1.035)}}
.breathe{transform-origin:189.5px 149px;transform-box:view-box;animation:breathe 4s ease-in-out infinite}
@keyframes z{0%{opacity:0;transform:translate(6px,6px)}20%{opacity:1}70%{opacity:1}100%{opacity:0;transform:translate(-4px,-8px)}}
.z{opacity:0;animation:z 4s ease-in-out infinite}
.z0{animation-delay:0.0s}.z1{animation-delay:0.7s}.z2{animation-delay:1.4s}.z3{animation-delay:2.1s}
@media (prefers-color-scheme: dark){.z{filter:invert(1)}}
@media (prefers-reduced-motion: reduce){.breathe{animation:none}.z{animation:none;opacity:1}}
</style>
<g class="breathe"><image x="100" y="14" width="179" height="135" href="data:image/png;base64,"/></g><image class="z z0" x="66" y="97" width="12" height="12" href="data:image/png;base64,"/><image class="z z1" x="52" y="77" width="15" height="16" href="data:image/png;base64,"/><image class="z z2" x="38" y="57" width="19" height="17" href="data:image/png;base64,"/><image class="z z3" x="24" y="37" width="20" height="18" href="data:image/png;base64,"/>
</svg>