<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2240 160" width="2240" height="160">
<style>
@keyframes f0{0%,100%{opacity:0} 0%{opacity:1} 39.99%{opacity:1} 40%{opacity:0}}
