@keyframes travel{0.00%{transform:translateX(80px)} 3.06%{transform:translateX(80px)} 5.56%{transform:translateX(206px)} 8.61%{transform:translateX(206px)} 11.11%{transform:translateX(331px)} 14.17%{transform:translateX(331px)} 16.67%{transform:translateX(457px)} 19.72%{transform:translateX(457px)} 22.22%{transform:translateX(582px)} 25.28%{transform:translateX(582px)} 27.78%{transform:translateX(708px)} 30.83%{transform:translateX(708px)} 33.33%{transform:translateX(833px)} 36.39%{transform:translateX(833px)} 38.89%{transform:translateX(959px)} 41.94%{transform:translateX(959px)} 44.44%{transform:translateX(1084px)} 47.50%{transform:translateX(1084px)} 50.00%{transform:translateX(1210px)} 53.06%{transform:translateX(1210px)} 55.56%{transform:translateX(1336px)} 58.61%{transform:translateX(1336px)} 61.11%{transform:translateX(1461px)} 64.17%{transform:translateX(1461px)} 66.67%{transform:translateX(1587px)} 69.72%{transform:translateX(1587px)} 72.22%{transform:translateX(1712px)} 75.28%{transform:translateX(1712px)} 77.78%{transform:translateX(1838px)} 80.83%{transform:translateX(1838px)} 83.33%{transform:translateX(1963px)} 86.39%{transform:translateX(1963px)} 88.89%{transform:translateX(2089px)} 91.94%{transform:translateX(2089px)} 94.44%{transform:translateX(2214px)} 97.50%{transform:translateX(2214px)} 100%{transform:translateX(2340px)}}
